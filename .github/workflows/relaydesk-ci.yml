name: RelayDesk CI

on:
  push:
    branches: ["main"]
    paths:
      - "relaydesk/**"
      - ".github/workflows/relaydesk-ci.yml"
  pull_request:
    paths:
      - "relaydesk/**"
      - ".github/workflows/relaydesk-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relaydesk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: relaydesk/pyproject.toml
      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff
        run: ruff check backend tests
      - name: Pytest
        run: pytest -q
