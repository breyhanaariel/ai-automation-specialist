<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>OrbitOps</title><link rel="stylesheet" href="/static/style.css"></head><body><main><p class="eyebrow">ORBITOPS</p><h1>Agentic Operations Console</h1><p>Run a synthetic multi-agent mission with shared state and an explicit human approval boundary.</p><form id="f"><input name="company" value="Northstar Labs" required><textarea name="objective">Prepare a customer onboarding workflow</textarea><label><input name="approve_external_action" type="checkbox"> Approve external action</label><button>Run Mission</button></form><pre id="out">Ready.</pre></main><script>f.onsubmit=async e=>{e.preventDefault();let d=new FormData(f),x={company:d.get('company'),objective:d.get('objective'),approve_external_action:d.has('approve_external_action')};let r=await fetch('/api/run',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(x)});out.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
