<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>LedgerLoom</title><link rel="stylesheet" href="/static/style.css"></head><body><main><p class="eyebrow">LEDGERLOOM</p><h1>Document Approval Console</h1><p>Process a synthetic invoice through extraction, reconciliation, and human approval controls.</p><form id="f"><input name="vendor" value="Northstar Supplies" required><input name="invoice_id" value="INV-1042" required><input name="amount" type="number" value="1240" step=".01"><input name="po_amount" type="number" value="1200" step=".01"><input name="confidence" type="number" value=".94" step=".01" min="0" max="1"><button>Process Document</button></form><pre id="out">Ready.</pre></main><script>f.onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(f));x.amount=+x.amount;x.po_amount=+x.po_amount;x.confidence=+x.confidence;let r=await fetch('/api/process',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(x)});out.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
